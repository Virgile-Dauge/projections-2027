<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Projections 2027 — carte mobilisation par bureau de vote</title>
    <meta
      name="description"
      content="Réserve de voix mobilisables par bloc, rapport de force projeté et résultats 2024 réels, par bureau de vote. Assemblage de briques validées, méthode publique."
    />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bandeau">
      <strong id="bandeau-titre">Carte descriptive</strong>
      <span id="bandeau-texte">— résultats 2024 réels, pas une projection.</span>
      <a href="methode.html">Méthode, hypothèses, limites</a>
    </div>

    <div id="carte"></div>

    <div id="controles">
      <fieldset id="selecteur-couche">
        <legend>Couche</legend>
        <label><input type="radio" name="couche" value="resultats2024" checked />Résultats 2024</label>
        <label><input type="radio" name="couche" value="reserve" />Réserve mobilisable</label>
        <label><input type="radio" name="couche" value="force" />Rapport de force</label>
      </fieldset>
      <!-- Décision mainteneur (PR #33) : la carte n'affiche que la réserve du
           bloc Gauche — pas de sélecteur de bloc ; les autres blocs restent
           publiés dans reserve-2027.md (voir la page méthode). -->
      <div id="reglage-opacite" class="panneau-controle">
        <label for="curseur-opacite">Opacité des données : <span id="valeur-opacite">100 %</span></label>
        <input type="range" id="curseur-opacite" min="0" max="1" step="0.05" value="1" />
      </div>
    </div>

    <div id="legende">
      <ul>
        <li><span class="pastille" style="background: #e60000"></span>Gauche</li>
        <li><span class="pastille" style="background: #ffcc00"></span>Centre</li>
        <li><span class="pastille" style="background: #542788"></span>Droite</li>
        <li><span class="pastille" style="background: #996633"></span>Extrême droite</li>
        <li><span class="pastille" style="background: #bababa"></span>Divers</li>
      </ul>
      <p id="legende-quantile" hidden>
        <span id="legende-texte-quantile"></span>
        <span class="degrade-exemple"></span> commune en repli (statut agrégé, dégradation visible).
      </p>
    </div>

    <div id="panneau" hidden></div>

    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
